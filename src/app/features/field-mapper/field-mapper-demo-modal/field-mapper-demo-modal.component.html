<div
  class="field-mapper-modal-backdrop"
  (click)="onBackdropClick()"
  role="button"
  tabindex="0"
  (keydown.escape)="onBackdropClick()"
></div>
<div class="field-mapper-modal" role="dialog" aria-modal="true" aria-label="Field mapper demo">
  <div class="field-mapper-modal-header">
    <h2 class="field-mapper-modal-title">Field mapper demo</h2>
    <button
      type="button"
      class="field-mapper-modal-close"
      (click)="onCloseClick()"
      title="Close"
    >
      ×
    </button>
  </div>
  <div class="field-mapper-modal-body">
    <app-field-mapper />
  </div>
</div>
