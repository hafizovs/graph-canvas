<svg
  class="mapper-links-overlay"
  [attr.viewBox]="'0 0 ' + width() + ' ' + height()"
  preserveAspectRatio="none"
>
  <svg:defs>
    <svg:marker
      id="mapper-arrow"
      markerWidth="10"
      markerHeight="8"
      refX="9"
      refY="4"
      orient="auto"
    >
      <svg:path d="M0 0 L10 4 L0 8 Z" fill="var(--mapper-link-stroke)" />
    </svg:marker>
    <svg:marker
      id="mapper-arrow-selected"
      markerWidth="10"
      markerHeight="8"
      refX="9"
      refY="4"
      orient="auto"
    >
      <svg:path d="M0 0 L10 4 L0 8 Z" fill="var(--mapper-link-selected-stroke)" />
    </svg:marker>
    <svg:marker
      id="mapper-arrow-preview"
      markerWidth="10"
      markerHeight="8"
      refX="9"
      refY="4"
      orient="auto"
    >
      <svg:path d="M0 0 L10 4 L0 8 Z" fill="var(--mapper-preview-stroke)" />
    </svg:marker>
  </svg:defs>
  @for (item of pathItems(); track getMappingKey(item.mapping)) {
    <svg:path
      class="mapper-link-hit"
      [attr.d]="item.pathD"
      fill="none"
      stroke="transparent"
      stroke-width="20"
      vector-effect="non-scaling-stroke"
      (click)="onPathClick(item.mapping, $event)"
    />
    <svg:path
      class="mapper-link-path"
      [class.mapper-link-path-selected]="isSelected(item.mapping)"
      [attr.d]="item.pathD"
      [attr.marker-end]="isSelected(item.mapping) ? 'url(#mapper-arrow-selected)' : 'url(#mapper-arrow)'"
      fill="none"
      stroke="var(--mapper-link-stroke)"
      stroke-width="2"
      vector-effect="non-scaling-stroke"
      pointer-events="none"
    />
  }
  @if (previewPathD()) {
    <svg:path
      class="mapper-preview-path"
      [attr.d]="previewPathD()"
      fill="none"
      stroke="var(--mapper-preview-stroke)"
      stroke-width="2"
      stroke-dasharray="6 4"
      vector-effect="non-scaling-stroke"
      marker-end="url(#mapper-arrow-preview)"
    />
  }
</svg>
