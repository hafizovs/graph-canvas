<div class="toolbar">
  <button
    type="button"
    class="toolbar-btn"
    [disabled]="disabled()"
    (click)="onAddNode()"
    title="Add node"
  >
    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="12" y1="5" x2="12" y2="19" />
      <line x1="5" y1="12" x2="19" y2="12" />
    </svg>
    <span>Add node</span>
  </button>
  <button
    type="button"
    class="toolbar-btn"
    [disabled]="!hasSelection()"
    (click)="onDeleteSelection()"
    title="Delete selected"
  >
    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <polyline points="3 6 5 6 21 6" />
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
      <line x1="10" y1="11" x2="10" y2="17" />
      <line x1="14" y1="11" x2="14" y2="17" />
    </svg>
    <span>Delete</span>
  </button>
  <span class="toolbar-sep" aria-hidden="true"></span>
  <button
    type="button"
    class="toolbar-btn"
    [disabled]="disabled()"
    (click)="onZoomIn()"
    title="Zoom in"
  >
    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8" />
      <line x1="21" y1="21" x2="16.65" y2="16.65" />
      <line x1="11" y1="8" x2="11" y2="14" />
      <line x1="8" y1="11" x2="14" y2="11" />
    </svg>
    <span>Zoom in</span>
  </button>
  <button
    type="button"
    class="toolbar-btn"
    [disabled]="disabled()"
    (click)="onZoomOut()"
    title="Zoom out"
  >
    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8" />
      <line x1="21" y1="21" x2="16.65" y2="16.65" />
      <line x1="8" y1="11" x2="14" y2="11" />
    </svg>
    <span>Zoom out</span>
  </button>
  <button
    type="button"
    class="toolbar-btn"
    [disabled]="disabled()"
    (click)="onFitToView()"
    title="Fit to view. Pan: Space + drag or middle mouse"
  >
    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3" />
    </svg>
    <span>Fit</span>
  </button>
  <button
    type="button"
    class="toolbar-btn"
    [disabled]="!hasSelection()"
    (click)="onZoomToSelection()"
    title="Zoom to selection"
  >
    <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="3" width="7" height="7" />
      <rect x="14" y="3" width="7" height="7" />
      <rect x="14" y="14" width="7" height="7" />
      <rect x="3" y="14" width="7" height="7" />
    </svg>
    <span>Zoom to selection</span>
  </button>
  <span class="toolbar-sep" aria-hidden="true"></span>
  <span class="toolbar-label">Examples:</span>
  <button type="button" class="toolbar-btn" [disabled]="disabled()" (click)="onLoadExample(exampleEmpty)" title="Empty diagram">
    Empty
  </button>
  <button type="button" class="toolbar-btn" [disabled]="disabled()" (click)="onLoadExample(exampleSingle)" title="Single node">
    Single
  </button>
  <button type="button" class="toolbar-btn" [disabled]="disabled()" (click)="onLoadExample(exampleChain)" title="Chain A→B→C">
    Chain
  </button>
  <button type="button" class="toolbar-btn" [disabled]="disabled()" (click)="onLoadExample(exampleDiamond)" title="Diamond">
    Diamond
  </button>
  <span class="toolbar-sep" aria-hidden="true"></span>
  <button type="button" class="toolbar-btn" [disabled]="disabled()" (click)="onSave()" title="Save to file and storage">
    Save
  </button>
  <button type="button" class="toolbar-btn" [disabled]="disabled()" (click)="onLoadFile(fileInput)" title="Load from file">
    Load file
  </button>
  <input
    #fileInput
    type="file"
    accept=".json,application/json"
    class="toolbar-file-input"
    (change)="onFileSelected($event, fileInput)"
  />
  <button type="button" class="toolbar-btn" [disabled]="disabled()" (click)="onLoadFromStorage()" title="Load from storage">
    Load storage
  </button>
</div>
