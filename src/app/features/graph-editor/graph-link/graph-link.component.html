<!-- Hit area: wide transparent stroke for segment grab; receives pointer and click -->
<svg:path
  class="link-path-hit"
  [class.link-selected]="selected()"
  [attr.d]="pathD()"
  fill="none"
  stroke="transparent"
  stroke-width="20"
  vector-effect="non-scaling-stroke"
  (pointerdown)="onPathPointerDown($event)"
  (click)="onLinkClick($event)"
  (contextmenu)="onLinkContextMenu($event)"
  (mouseenter)="hovered.set(true)"
  (mouseleave)="hovered.set(false)"
/>
<!-- Visible path -->
<svg:path
  class="link-path"
  [class.link-selected]="selected()"
  [attr.d]="pathD()"
  fill="none"
  [attr.stroke]="previewTarget() ? 'var(--link-preview-stroke, #95a)' : 'var(--link-stroke, #666)'"
  stroke-width="2"
  vector-effect="non-scaling-stroke"
  pointer-events="none"
/>
@if ((selected() || hovered()) && !previewTarget()) {
  @for (seg of segmentMidpoints(); track seg.insertIndex) {
    <svg:circle
      class="segment-handle"
      [attr.cx]="seg.x"
      [attr.cy]="seg.y"
      r="5"
      (pointerdown)="onSegmentMidpointPointerDown($event, seg)"
      (mouseenter)="hovered.set(true)"
      (mouseleave)="hovered.set(false)"
    />
  }
  @for (point of waypoints(); track $index) {
    <svg:g
      (mouseenter)="hovered.set(true)"
      (mouseleave)="hovered.set(false)"
    >
      <svg:circle
        class="waypoint-hit"
        [attr.cx]="point.x"
        [attr.cy]="point.y"
        r="12"
        fill="transparent"
        (pointerdown)="onWaypointPointerDown($event, $index)"
        (dblclick)="onWaypointDoubleClick($index)"
        (contextmenu)="onWaypointContextMenu($event, $index)"
      />
      <svg:circle
        class="waypoint-handle"
        [class.waypoint-handle-selected]="selectedWaypointIndex() === $index"
        [attr.cx]="point.x"
        [attr.cy]="point.y"
        r="5"
        pointer-events="none"
      />
    </svg:g>
  }
}
