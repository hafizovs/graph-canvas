<div
  class="graph-editor"
  [attr.data-tick]="renderTick()"
  (pointermove)="onContainerPointerMove($event)"
  (pointerup)="onContainerPointerUp($event)"
>
  <app-graph-toolbar
    (addNode)="onAddNode()"
    (deleteSelection)="onDeleteSelection()"
    (zoomIn)="onZoomIn()"
    (zoomOut)="onZoomOut()"
    (fitToView)="onFitToView()"
    (zoomToSelection)="onZoomToSelection()"
    (loadExample)="onLoadExample($event)"
    (saveRequest)="onSave()"
    (loadFromFile)="onLoadFromFile($event)"
    (loadFromStorage)="onLoadFromStorage()"
    [hasSelection]="hasSelection()"
  />

  <div
    class="canvas-wrapper"
    [class.pan-mode]="isPanMode"
  >
    <svg
      #svgContainer
      class="graph-svg"
      [attr.viewBox]="viewBox().x + ' ' + viewBox().y + ' ' + viewBox().width + ' ' + viewBox().height"
      preserveAspectRatio="xMidYMid meet"
      (pointerdown)="onCanvasPointerDown($event)"
    >
      <g class="graph-content">
        <g class="links-layer">
          @for (link of diagram()?.links ?? []; track link.id) {
            <g
              app-graph-link
              [link]="link"
              [diagram]="diagram()!"
              [selected]="selectedLinkIds().has(link.id)"
              (linkClick)="onLinkSelect($event)"
            ></g>
          }
          @if (linkingFrom() && linkingPreviewPoint()) {
            <path
              class="link-preview-path"
              [attr.d]="getPreviewPathD()"
              fill="none"
              stroke="var(--link-preview-stroke, #95a)"
              stroke-width="2"
              stroke-dasharray="4 4"
              vector-effect="non-scaling-stroke"
              pointer-events="none"
            />
          }
        </g>
        <g class="nodes-layer">
          @for (node of diagram()?.nodes ?? []; track node.id) {
            <g
              app-graph-node
              [node]="node"
              [selected]="selectedNodeIds().has(node.id)"
              (nodePointerDown)="onNodePointerDown($event)"
              (nodePointerMove)="onNodePointerMove($event)"
              (nodePointerUp)="onNodePointerUp($event)"
              (portPointerDown)="onPortPointerDown($event)"
            ></g>
          }
        </g>
        @if (normalizedSelectionRect; as nr) {
          <rect
            class="selection-rect"
            [attr.x]="nr.x"
            [attr.y]="nr.y"
            [attr.width]="nr.width"
            [attr.height]="nr.height"
            fill="var(--selection-rect-fill, rgba(100, 150, 255, 0.1))"
            stroke="var(--selection-rect-stroke, #48f)"
            stroke-width="1.5"
            stroke-dasharray="4 4"
            pointer-events="none"
          />
        }
      </g>
    </svg>
  </div>
</div>
