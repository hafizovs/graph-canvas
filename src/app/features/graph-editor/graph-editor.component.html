<div
  class="graph-editor"
  [attr.data-tick]="renderTick()"
  (pointermove)="onContainerPointerMove($event)"
  (pointerup)="onContainerPointerUp($event)"
>
  <app-graph-toolbar
    (addNode)="onAddNode()"
    (deleteSelection)="onDeleteSelection()"
    (zoomIn)="onZoomIn()"
    (zoomOut)="onZoomOut()"
    (fitToView)="onFitToView()"
    (zoomToSelection)="onZoomToSelection()"
    (snapToGridToggle)="onSnapToGridToggle()"
    (loadExample)="onLoadExample($event)"
    (saveRequest)="onSave()"
    (loadFromFile)="onLoadFromFile($event)"
    (loadFromStorage)="onLoadFromStorage()"
    [hasSelection]="hasSelection()"
    [snapToGridEnabled]="snapToGridEnabled()"
  />

  <div
    class="editor-main"
    [class.palette-dragging]="draggingFromPalette()"
    [class.palette-drop-over-canvas]="draggingFromPalette() && paletteDropPreview() !== null"
  >
    <app-graph-palette (shapeDragStart)="onPaletteShapeDragStart($event)" />

    <div
      class="canvas-wrapper"
      [class.pan-mode]="isPanMode"
    >
    <svg
      #svgContainer
      class="graph-svg"
      [attr.viewBox]="viewBox().x + ' ' + viewBox().y + ' ' + viewBox().width + ' ' + viewBox().height"
      preserveAspectRatio="xMidYMid meet"
      (pointerdown)="onCanvasPointerDown($event)"
    >
      <defs>
        <pattern
          id="grid-pattern"
          [attr.width]="gridStep"
          [attr.height]="gridStep"
          patternUnits="userSpaceOnUse"
        >
          <path
            [attr.d]="'M 0 0 L 0 ' + gridStep + ' M 0 0 L ' + gridStep + ' 0'"
            fill="none"
            stroke="var(--grid-stroke, #ddd)"
            stroke-width="0.5"
          />
        </pattern>
      </defs>
      <g class="graph-content">
        @if (snapToGridEnabled()) {
          <rect
            class="grid-layer"
            [attr.x]="viewBox().x - gridStep"
            [attr.y]="viewBox().y - gridStep"
            [attr.width]="viewBox().width + gridStep * 2"
            [attr.height]="viewBox().height + gridStep * 2"
            fill="url(#grid-pattern)"
          />
        }
        <g class="links-layer">
          @for (link of diagram()?.links ?? []; track link.id) {
            <g
              app-graph-link
              [link]="link"
              [diagram]="diagram()!"
              [selected]="selectedLinkIds().has(link.id)"
              (linkClick)="onLinkSelect($event)"
            ></g>
          }
          @if (linkingFrom() && linkingPreviewPoint()) {
            <path
              class="link-preview-path"
              [attr.d]="getPreviewPathD()"
              fill="none"
              stroke="var(--link-preview-stroke, #95a)"
              stroke-width="2"
              stroke-dasharray="4 4"
              vector-effect="non-scaling-stroke"
              pointer-events="none"
            />
          }
        </g>
        <g class="nodes-layer">
          @for (node of diagram()?.nodes ?? []; track node.id) {
            <g
              app-graph-node
              [node]="node"
              [selected]="selectedNodeIds().has(node.id)"
              (nodePointerDown)="onNodePointerDown($event)"
              (nodePointerMove)="onNodePointerMove($event)"
              (nodePointerUp)="onNodePointerUp($event)"
              (portPointerDown)="onPortPointerDown($event)"
            ></g>
          }
        </g>
        @if (normalizedSelectionRect; as nr) {
          <rect
            class="selection-rect"
            [attr.x]="nr.x"
            [attr.y]="nr.y"
            [attr.width]="nr.width"
            [attr.height]="nr.height"
            fill="var(--selection-rect-fill, rgba(100, 150, 255, 0.1))"
            stroke="var(--selection-rect-stroke, #48f)"
            stroke-width="1.5"
            stroke-dasharray="4 4"
            pointer-events="none"
          />
        }
        @if (draggingFromPalette() && paletteDropPreview(); as preview) {
          <g class="palette-drop-preview" [attr.transform]="'translate(' + preview.x + ',' + preview.y + ')'">
            @switch (preview.shape) {
              @case ('roundedRect') {
                <rect class="preview-shape" width="120" height="60" rx="30" ry="15" />
              }
              @case ('circle') {
                <ellipse class="preview-shape" cx="60" cy="30" rx="60" ry="30" />
              }
              @case ('ellipse') {
                <ellipse class="preview-shape" cx="60" cy="30" rx="60" ry="30" />
              }
              @case ('diamond') {
                <polygon class="preview-shape" [attr.points]="getPreviewDiamondPoints()" />
              }
              @case ('triangle') {
                <polygon class="preview-shape" [attr.points]="getPreviewTrianglePoints()" />
              }
              @case ('hexagon') {
                <polygon class="preview-shape" [attr.points]="getPreviewHexagonPoints()" />
              }
              @case ('parallelogram') {
                <polygon class="preview-shape" [attr.points]="getPreviewParallelogramPoints()" />
              }
              @case ('pentagon') {
                <polygon class="preview-shape" [attr.points]="getPreviewPentagonPoints()" />
              }
              @case ('cross') {
                <path class="preview-shape" [attr.d]="getPreviewCrossPath()" />
              }
              @default {
                <rect class="preview-shape" width="120" height="60" rx="6" ry="6" />
              }
            }
          </g>
        }
      </g>
    </svg>
  </div>
  </div>
</div>
